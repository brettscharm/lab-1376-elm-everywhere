<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --surface: #f4f4f4; --text: #161616; --muted: #525252;
    --border: #e0e0e0; --accent: #0f62fe; --accent-hover: #0043ce; --ok: #24a148;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616; --surface: #262626; --text: #f4f4f4; --muted: #c6c6c6;
      --border: #393939; --accent: #78a9ff; --accent-hover: #a6c8ff; --ok: #42be65;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 72px; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 "IBM Plex Sans", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: #161616; color: #fff;
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex-wrap: wrap; }
  header .name { font-weight: 600; margin-right: auto; color: #fff; text-decoration: none; }
  header a.btn { color: #fff; text-decoration: none; font-size: 14px; padding: 6px 12px;
    border: 1px solid #6f6f6f; border-radius: 4px; white-space: nowrap; }
  header a.btn.primary { background: #0f62fe; border-color: #0f62fe; }
  header a.btn:hover { border-color: #fff; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  h1, h2, h3 { line-height: 1.25; font-weight: 600; }
  h1 { font-size: 2rem; margin-top: 0.5rem; }
  h2 { font-size: 1.5rem; margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  h3 { font-size: 1.15rem; margin-top: 2rem; }
  a { color: var(--accent); }
  a:hover { color: var(--accent-hover); }
  hr { display: none; }
  img { max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 4px; }
  blockquote { margin: 1.5rem 0; padding: 12px 16px; background: var(--surface);
    border-left: 4px solid var(--accent); }
  blockquote p { margin: 0; }
  code { font-family: "IBM Plex Mono", monospace; font-size: 0.9em; background: var(--surface);
    padding: 1px 5px; border-radius: 3px; }
  .codewrap { position: relative; margin: 12px 0 16px; }
  pre { margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 14px 92px 14px 16px; white-space: pre-wrap; word-break: break-word; }
  pre code { background: none; padding: 0; font-size: 14px; line-height: 1.55; }
  .copy { position: absolute; top: 8px; right: 8px; font: 500 13px "IBM Plex Sans", sans-serif;
    background: var(--accent); color: #fff; border: 0; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  .copy:hover { background: var(--accent-hover); }
  .copy.done { background: var(--ok); }
  @media (prefers-color-scheme: dark) { .copy { color: #161616; } }
  details { background: var(--surface); padding: 8px 16px; border-radius: 6px; font-size: 14px; color: var(--muted); }
  summary { cursor: pointer; font-weight: 500; color: var(--text); }
  li { margin: 4px 0; }
  .cover { text-align: center; }
  .cta { display: flex; justify-content: center; flex-wrap: wrap; gap: 16px; margin: 28px 0; }
  .cta a { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 240px;
    padding: 16px 28px; border-radius: 8px; font-size: 18px; font-weight: 600; text-decoration: none;
    border: 2px solid var(--accent); }
  .cta a.solid { background: #0f62fe; border-color: #0f62fe; color: #fff; }
  .cta a.solid:hover { background: #0043ce; border-color: #0043ce; color: #fff; }
  .cta a.outline { color: var(--accent); background: transparent; }
  .cta a.outline:hover { background: var(--surface); }
  @media (max-width: 600px) {
    .cta { flex-direction: column; gap: 12px; }
    .cta a { width: 100%; min-width: 0; padding: 20px; font-size: 20px; }
    .cta { margin-top: 4px; }
    h1 { font-size: 1.6rem; text-align: center; }
  }
  /* The site has its own buttons at the top, so hide the README's GitHub-only badge row. */
  main p.lab-buttons { display: none; }
  main p[align="center"] { text-align: center; }
</style>
</head>
<body>
<header>
  <a class="name" href="#">Lab 1376 · ELM everywhere</a>
  <a class="btn" href="#table-of-contents">Contents</a>
  <a class="btn" href="https://github.com/brettscharm/lab-1376-elm-everywhere">GitHub</a>
</header>
<main>
<div class="cta">
  <a class="solid" href="Lab-1376-ELM-everywhere.pdf" target="_blank" rel="noopener">📄 Open PDF</a>
  <a class="outline" href="Lab-1376-ELM-everywhere.pdf" download>⬇️ Download PDF</a>
</div>
{{ content }}
</main>
<script>
  // Match GitHub's heading anchors so the table-of-contents links work here too.
  document.querySelectorAll('main h1, main h2, main h3').forEach(function (h) {
    h.id = h.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');
  });
  // Add a Copy button to every prompt block.
  document.querySelectorAll('main pre').forEach(function (pre) {
    var wrap = document.createElement('div');
    wrap.className = 'codewrap';
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);
    var btn = document.createElement('button');
    btn.className = 'copy';
    btn.type = 'button';
    btn.textContent = 'Copy';
    btn.addEventListener('click', function () {
      navigator.clipboard.writeText(pre.innerText.trim()).then(function () {
        btn.textContent = 'Copied ✓';
        btn.classList.add('done');
        setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1500);
      });
    });
    wrap.appendChild(btn);
  });
  if (location.hash) { var t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
</script>
</body>
</html>
